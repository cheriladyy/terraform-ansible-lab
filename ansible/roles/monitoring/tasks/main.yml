- name: Install Docker Compose v2 plugin
  ansible.builtin.apt:
    name: docker-compose-v2
    state: present

- name: Create Zabbix directory
  ansible.builtin.file:
    path: "{{ monitoring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Copy docker-compose.yml
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Write .env with DB credentials
  ansible.builtin.template:
    src: env.j2
    dest: "{{ monitoring_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Start Zabbix stack
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    state: present
    pull: missing
