services:
  postgres:
    image: postgres:16.16
    container_name: zabbix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ZABBIX_DB_USER:?}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?}
      POSTGRES_DB: ${ZABBIX_DB_NAME:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - zabbix

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0.32
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: ${ZABBIX_DB_USER:?}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?}
      POSTGRES_DB: ${ZABBIX_DB_NAME:?}
    ports:
      - "10051:10051"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zabbix

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0.32
    container_name: zabbix-web
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: ${ZABBIX_DB_USER:?}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?}
      POSTGRES_DB: ${ZABBIX_DB_NAME:?}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: Europe/Istanbul
    ports:
      - "80:8080"
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    networks:
      - zabbix

volumes:
  postgres_data:

networks:
  zabbix:
    driver: bridge
