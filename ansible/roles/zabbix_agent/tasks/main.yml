- name: Add Zabbix 7.0 repository
  ansible.builtin.apt:
    deb: "{{ zabbix_release_deb_url }}"
    state: present

- name: Install Zabbix Agent 2
  ansible.builtin.apt:
    name: zabbix-agent2
    state: present
    update_cache: true

- name: Configure Zabbix Agent 2 (active checks)
  ansible.builtin.template:
    src: zabbix_agent2.conf.j2
    dest: /etc/zabbix/zabbix_agent2.conf
    owner: root
    group: zabbix
    mode: "0640"
  notify: Restart zabbix-agent2

- name: Ensure Zabbix Agent 2 is running
  ansible.builtin.service:
    name: zabbix-agent2
    state: started
    enabled: true
