# ansible.cfg Sistemin nasıl çalışacağını belirler.
# Congfig dosyası varsayılan olarak /etc/ansible/ansible.cfg yolundadır.
# Ama ben komutları proje klasöründen çalıştıracağım için buraya ekledim.
# Jenkins kullanırken yolu environment variable'lar ile verebiliyoruz.
# Baktığı yol sırlaması ./ansible.cfg > ~/ansible.cfg > /etc/ansible/ansible.cfg
# Tüm Ansible komutları control node'dan çalıştırılıyor. Benim control node'um Mac, AWS'deki EC2 değil.
# Ansible'ın çalışması için makinalarda Python yüklü olması lazım.
# Control node managed node'ları yönetiyor. Playbookları çalıştıranlar da managed node'lar. Host diyoruz bunlara. Ansible agentless. 
[defaults]
# Hangi sunuculara bağlanılacağı
inventory          = inventory/aws_ec2.yml
roles_path         = roles

# Vault parolası repo dışında durur
vault_password_file = ~/.ansible/app-vault-pass

# Bağlantı bilgileri
remote_user        = ubuntu
private_key_file   = ~/.ssh/bgd

# Ubuntu 24.04'te python3'ü otomatik bulsun
interpreter_python = auto_silent
